[package]
name = "session-transfer"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Convert Codex CLI and Claude Code sessions into each other, so that a session can continue on the other harness"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
ryu = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[lints.rust]
unsafe_code = "forbid"

# Same policy as services/api-rs. CI runs clippy with -D warnings.
[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
